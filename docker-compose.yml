name: dataimport

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped # If PostgreSQL crashes or Docker restarts, restart the container automatically.
    env_file: ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      RUSTFS_CONSOLE_ENABLE: "true" # console is OFF by default
      RUSTFS_REGION: # Origins allowed to PUT files straight to this server with a presigned

      # URL: the Vite dev server (5173) and the frontend container below (8080).
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_running" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: [ "node", "dist/worker/index.js" ]
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file:
      - ./backend/.env
      - ./backend/.env.docker # later file wins: localhost -> service names
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # Production build of the React app, served by Nginx, which also forwards
  # /api and /health to the backend so the browser sees a single origin.
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  rustfs-data:
  rabbitmq-data:
  redis-data:
