name: dataimport

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped # If PostgreSQL crashes or Docker restarts, restart the container automatically.
    env_file: ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      RUSTFS_CONSOLE_ENABLE: "true" # console is OFF by default
      RUSTFS_REGION:
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    ports:
      - "9000:9000" # S3 API — Express and the browser's presigned PUT target this
      - "9001:9001" # web console — human access only, never used by the app
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_running" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
  rustfs-data:
  rabbitmq-data:
